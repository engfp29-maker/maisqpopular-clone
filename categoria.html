<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Categoria | Farmácia Mais Que Popular</title>
  <meta name="description" content="Explore as categorias da Farmácia Mais Que Popular: medicamentos e saúde, dermo e beleza, mamães e bebês, vitaminas e muito mais." />
  <link rel="icon" href="logo.webp" type="image/webp" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Farmácia Mais Que Popular" />
  <meta property="og:image" content="logo.webp" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header id="site-header"></header>

  <main class="wrap">
    <div class="benefits" id="benefits"></div>
    <nav class="crumb" id="crumb"></nav>

    <div class="cat-layout no-filters">
      <section>
        <div class="cat-head">
          <h1 id="cat-title">Produtos</h1>
          <p id="cat-sub"></p>
        </div>
        <div class="cat-toolbar">
          <label class="tb-field">
            <span>Ordenar por</span>
            <select id="sort">
              <option value="rel">Relevância</option>
              <option value="price-asc">Menor preço</option>
              <option value="price-desc">Maior preço</option>
              <option value="discount">Maior desconto</option>
              <option value="name">Nome (A-Z)</option>
            </select>
          </label>
          <label class="tb-field">
            <span>Preço até</span>
            <input type="range" id="maxprice" min="0" max="250" value="250" step="5" />
            <output id="maxprice-out">R$ 250,00</output>
          </label>
          <label class="tb-check">
            <input type="checkbox" id="only-offers" /> Só ofertas
          </label>
          <label class="tb-field" id="kind-wrap" hidden>
            <span>Tipo</span>
            <select id="kind">
              <option value="">Todos os tipos</option>
              <option value="Referência">Referência (ético)</option>
              <option value="Genérico">Genérico</option>
              <option value="Similar">Similar</option>
            </select>
          </label>
          <span class="tb-count" id="count"></span>
        </div>
        <div class="cat-grid" id="cat-grid"></div>
        <nav class="pager" id="pager" aria-label="Paginação" hidden></nav>
        <div class="empty" id="cat-empty" hidden>
          <div class="e-ico">🔎</div>
          <h3>Nenhum produto encontrado</h3>
          <p>Tente ajustar os filtros ou buscar por outro termo.</p>
        </div>
      </section>
    </div>
  </main>

  <a class="wpp-float" id="wpp" target="_blank" rel="noopener" href="#">💬 Comprar pelo WhatsApp</a>

  <footer>
    <div class="foot-bottom">
      <p id="f-legal"></p>
    </div>
  </footer>

  <script src="produtos.js"></script><script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const params = new URLSearchParams(location.search);
      const q = params.get("q");
      const slug = canonCat(params.get("cat")) || "ofertas";

      // Link antigo (ex.: ?cat=marcas-exclusivas) → corrige a barra de endereços
      if (!q && params.get("cat") && params.get("cat") !== slug) {
        history.replaceState(null, "", `categoria.html?cat=${slug}`);
      }

      let title, sub, base;
      if (q) {
        const term = q.toLowerCase();
        base = PRODUCTS.filter((p) =>
          (p.name + " " + p.tag + " " + catName(p.cat)).toLowerCase().includes(term));
        title = `Resultados para “${q}”`;
      } else {
        base = byCat(slug);
        title = catName(slug);
        sub = slug === "ofertas"
          ? "Seleção especial com os melhores preços da semana."
          : `Confira os produtos de ${catName(slug)}.`;
      }

      document.getElementById("cat-title").textContent = title;
      document.getElementById("cat-sub").textContent = sub || "";
      document.getElementById("crumb").innerHTML =
        `<a href="index.html">Início</a> › <span>${title}</span>`;

      // SEO dinâmico
      document.title = `${title} | Farmácia Mais Que Popular`;
      const metaDesc = document.querySelector('meta[name="description"]');
      if (metaDesc) metaDesc.content = sub || `Confira ${title} na Farmácia Mais Que Popular, com entrega no Tapanã, Pratinha, Parque Verde e Icoaraci.`;
      const ogTitle = document.querySelector('meta[property="og:title"]');
      if (ogTitle) ogTitle.content = `${title} | Farmácia Mais Que Popular`;
      if (!q) {
        const canonical = document.querySelector('link[rel="canonical"]') || document.createElement("link");
        canonical.rel = "canonical";
        canonical.href = `${location.origin}${location.pathname}?cat=${slug}`;
        if (!canonical.parentNode) document.head.appendChild(canonical);
      }

      document.getElementById("wpp").href =
        wpp(`Olá! Vim pelo site e queria consultar sobre: ${title}.`);

      // Faixa máxima de preço (dinâmica conforme a lista base)
      const maxInReal = Math.max(50, Math.ceil(Math.max(...base.map((p) => p.price), 0) / 100 / 10) * 10);
      const slider = document.getElementById("maxprice");
      slider.max = maxInReal;
      slider.value = maxInReal;
      const out = document.getElementById("maxprice-out");
      const fmtOut = () => out.textContent = brl(slider.value * 100);
      fmtOut();

      // Catálogo grande: mostrar em páginas para não renderizar ~2 mil cards de uma vez
      const PER_PAGE = 24;
      let page = 1;
      const kindSel = document.getElementById("kind");
      const kindWrap = document.getElementById("kind-wrap");
      // O filtro por tipo (ético/genérico/similar) só faz sentido em medicamentos
      const hasKinds = base.some((p) => p.tag && kindSel.querySelector(`option[value="${p.tag}"]`));
      if (hasKinds) kindWrap.hidden = false;

      function currentList() {
        const sort = document.getElementById("sort").value;
        const maxPrice = Number(slider.value) * 100;
        const onlyOffers = document.getElementById("only-offers").checked;
        const kind = kindSel.value;

        const list = base.filter((p) =>
          p.price <= maxPrice &&
          (!onlyOffers || p.oldPrice) &&
          (!kind || p.tag === kind)
        );
        if (sort === "price-asc") list.sort((a, b) => a.price - b.price);
        else if (sort === "price-desc") list.sort((a, b) => b.price - a.price);
        else if (sort === "discount") list.sort((a, b) => discountPct(b) - discountPct(a));
        else if (sort === "name") list.sort((a, b) => a.name.localeCompare(b.name, "pt-BR"));
        return list;
      }

      function renderPager(total) {
        const pager = document.getElementById("pager");
        const pages = Math.ceil(total / PER_PAGE);
        if (pages <= 1) { pager.hidden = true; pager.innerHTML = ""; return; }
        pager.hidden = false;
        const btn = (label, target, disabled, current) =>
          `<button type="button" data-page="${target}"${disabled ? " disabled" : ""}${current ? ' class="is-current" aria-current="page"' : ""}>${label}</button>`;
        // Janela de páginas em volta da atual (evita 80 botões seguidos)
        const start = Math.max(1, Math.min(page - 2, pages - 4));
        const end = Math.min(pages, start + 4);
        let html = btn("‹", page - 1, page === 1, false);
        if (start > 1) html += btn("1", 1, false, page === 1) + (start > 2 ? '<span class="pager-gap">…</span>' : "");
        for (let i = start; i <= end; i++) html += btn(i, i, false, i === page);
        if (end < pages) html += (end < pages - 1 ? '<span class="pager-gap">…</span>' : "") + btn(pages, pages, false, page === pages);
        html += btn("›", page + 1, page === pages, false);
        pager.innerHTML = html;
      }

      function apply(resetPage) {
        if (resetPage) page = 1;
        const list = currentList();
        document.getElementById("count").textContent = `${list.length} produto(s)`;

        const grid = document.getElementById("cat-grid");
        const empty = document.getElementById("cat-empty");
        const pager = document.getElementById("pager");
        if (!list.length) {
          grid.hidden = true;
          empty.hidden = false;
          pager.hidden = true;
          grid.innerHTML = "";
          return;
        }
        empty.hidden = true;
        grid.hidden = false;

        const pages = Math.ceil(list.length / PER_PAGE);
        if (page > pages) page = pages;
        const slice = list.slice((page - 1) * PER_PAGE, page * PER_PAGE);
        grid.innerHTML = slice.map(productCard).join("");
        renderPager(list.length);
      }

      document.getElementById("pager").addEventListener("click", (e) => {
        const b = e.target.closest("button[data-page]");
        if (!b || b.disabled) return;
        page = Number(b.dataset.page);
        apply(false);
        window.scrollTo({ top: 0, behavior: "smooth" });
      });

      document.getElementById("sort").onchange = () => apply(true);
      kindSel.addEventListener("change", () => apply(true));
      slider.oninput = () => { fmtOut(); apply(true); };
      document.getElementById("only-offers").onchange = () => apply(true);
      apply(true);

      // Rodapé legal
      document.getElementById("f-legal").textContent =
        `${STORE.name} · CNPJ ${STORE.cnpj} · Farmacêutica responsável: ${STORE.farmaceutica}`;
    });
  </script>
</body>
</html>
