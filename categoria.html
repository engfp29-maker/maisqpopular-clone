<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Categoria | Farmácia Mais Que Popular</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header id="site-header"></header>

  <main class="wrap">
    <div class="benefits" id="benefits"></div>
    <nav class="crumb" id="crumb"></nav>

    <div class="cat-layout">
      <aside class="filters">
        <h3>Categorias</h3>
        <ul id="filter-list"></ul>
      </aside>

      <section>
        <div class="cat-head">
          <h1 id="cat-title">Produtos</h1>
          <p id="cat-sub"></p>
        </div>
        <div class="cat-toolbar">
          <label class="tb-field">
            <span>Ordenar por</span>
            <select id="sort">
              <option value="rel">Relevância</option>
              <option value="price-asc">Menor preço</option>
              <option value="price-desc">Maior preço</option>
              <option value="discount">Maior desconto</option>
              <option value="name">Nome (A-Z)</option>
            </select>
          </label>
          <label class="tb-field">
            <span>Preço até</span>
            <input type="range" id="maxprice" min="0" max="250" value="250" step="5" />
            <output id="maxprice-out">R$ 250,00</output>
          </label>
          <label class="tb-check">
            <input type="checkbox" id="only-offers" /> Só ofertas
          </label>
          <span class="tb-count" id="count"></span>
        </div>
        <div class="cat-grid" id="cat-grid"></div>
        <div class="empty" id="cat-empty" hidden>
          <div class="e-ico">🔎</div>
          <h3>Nenhum produto encontrado</h3>
          <p>Tente ajustar os filtros ou buscar por outro termo.</p>
        </div>
      </section>
    </div>
  </main>

  <a class="wpp-float" id="wpp" target="_blank" rel="noopener" href="#">💬 Comprar pelo WhatsApp</a>

  <footer>
    <div class="foot-bottom">
      <p id="f-legal"></p>
      <p class="demo">Site demonstrativo (clone de estudo). Produtos, preços e imagens são ilustrativos.</p>
    </div>
  </footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const params = new URLSearchParams(location.search);
      const cat = params.get("cat");
      const q = params.get("q");
      const slug = cat || "ofertas";

      // Filtros (menu lateral)
      document.getElementById("filter-list").innerHTML =
        CATEGORIES.map((c) => {
          const active = (slug === c.slug) ? " class=\"active\"" : "";
          return `<li><a href="categoria.html?cat=${c.slug}"${active}>${c.icon} ${c.name}</a></li>`;
        }).join("");

      let title, sub, base;
      if (q) {
        const term = q.toLowerCase();
        base = PRODUCTS.filter((p) =>
          (p.name + " " + p.tag + " " + catName(p.cat)).toLowerCase().includes(term));
        title = `Resultados para “${q}”`;
      } else {
        base = byCat(slug);
        title = catName(slug);
        sub = slug === "ofertas"
          ? "Seleção especial com os melhores preços da semana."
          : `Confira os produtos de ${catName(slug)}.`;
      }

      document.getElementById("cat-title").textContent = title;
      document.getElementById("cat-sub").textContent = sub || "";
      document.getElementById("crumb").innerHTML =
        `<a href="index.html">Início</a> › <span>${title}</span>`;

      document.getElementById("wpp").href =
        wpp(`Olá! Vim pelo site e queria consultar sobre: ${title}.`);

      // Faixa máxima de preço (dinâmica conforme a lista base)
      const maxInReal = Math.max(50, Math.ceil(Math.max(...base.map((p) => p.price), 0) / 100 / 10) * 10);
      const slider = document.getElementById("maxprice");
      slider.max = maxInReal;
      slider.value = maxInReal;
      const out = document.getElementById("maxprice-out");
      const fmtOut = () => out.textContent = brl(slider.value * 100);
      fmtOut();

      function apply() {
        const sort = document.getElementById("sort").value;
        const maxPrice = Number(slider.value) * 100;
        const onlyOffers = document.getElementById("only-offers").checked;

        let list = base.filter((p) => p.price <= maxPrice && (!onlyOffers || p.oldPrice));
        if (sort === "price-asc") list.sort((a, b) => a.price - b.price);
        else if (sort === "price-desc") list.sort((a, b) => b.price - a.price);
        else if (sort === "discount") list.sort((a, b) => discountPct(b) - discountPct(a));
        else if (sort === "name") list.sort((a, b) => a.name.localeCompare(b.name, "pt-BR"));

        document.getElementById("count").textContent =
          `${list.length} produto(s)`;
        const grid = document.getElementById("cat-grid");
        const empty = document.getElementById("cat-empty");
        if (list.length) { grid.hidden = false; empty.hidden = true; grid.innerHTML = list.map(productCard).join(""); }
        else { grid.hidden = true; empty.hidden = false; }
      }

      document.getElementById("sort").onchange = apply;
      slider.oninput = () => { fmtOut(); apply(); };
      document.getElementById("only-offers").onchange = apply;
      apply();

      // Rodapé legal
      document.getElementById("f-legal").textContent =
        `${STORE.name} · CNPJ ${STORE.cnpj} · Farmacêutica responsável: ${STORE.farmaceutica}`;
    });
  </script>
</body>
</html>
